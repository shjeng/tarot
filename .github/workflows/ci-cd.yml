# ================================================================
# CI/CD 파이프라인 워크플로우
#
# [전체 흐름]
#   1. main 브랜치에 push 또는 PR이 생성되면 자동 실행
#   2. 프론트엔드 CI + 백엔드 CI 를 병렬로 실행 (빌드 오류 조기 감지)
#   3. 두 CI가 모두 통과하면, main push 시에만 OCI VM에 자동 배포(CD)
#
# [실행 조건 요약]
#   - PR 생성/업데이트 → CI만 실행 (배포 안 함)
#   - main push        → CI + CD 모두 실행 (배포까지)
# ================================================================
name: CI/CD

on:
  push:
    branches: [main]       # main 브랜치에 push될 때 트리거
  pull_request:
    branches: [main]       # main 브랜치 대상 PR이 열릴 때 트리거

jobs:
  # ─────────────────────────────────────────
  # CI: 프론트엔드 빌드 검증
  #
  # 목적: 코드 품질 및 빌드 오류를 배포 전에 조기 감지
  # 실행 환경: GitHub Actions 가상 서버 (ubuntu-latest)
  # ─────────────────────────────────────────
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest   # GitHub이 제공하는 임시 Ubuntu 서버에서 실행
    defaults:
      run:
        working-directory: frontend  # 이 job의 모든 명령은 frontend/ 디렉토리 기준

    steps:
      # 1) 저장소 코드를 Actions 서버로 내려받기
      - uses: actions/checkout@v4

      # 2) Node.js 20 버전 설치 + npm 캐시 설정
      #    cache-dependency-path: 이 파일이 바뀌지 않으면 캐시된 node_modules 재사용 → 속도 향상
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # 3) package-lock.json 기준으로 정확한 버전의 의존성 설치
      #    (npm install 대신 npm ci를 쓰는 이유: 환경 간 버전 불일치 방지)
      - name: 의존성 설치
        run: npm ci

      # 4) ESLint로 코드 스타일 및 잠재적 오류 검사
      - name: Lint 검사
        run: npm run lint

      # 5) Next.js 빌드 실행 — TypeScript 타입 오류, import 오류 등을 여기서 잡아냄
      #    NEXT_PUBLIC_ 변수는 빌드 시 번들에 포함되므로 빌드 단계에서 주입 필요
      - name: 빌드 검증 (타입 오류 포함)
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

  # ─────────────────────────────────────────
  # CI: 백엔드 빌드 검증
  #
  # 목적: TypeScript 컴파일 오류를 배포 전에 조기 감지
  # ─────────────────────────────────────────
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend   # 이 job의 모든 명령은 backend/ 디렉토리 기준

    steps:
      # 1) 저장소 코드를 Actions 서버로 내려받기
      - uses: actions/checkout@v4

      # 2) Node.js 20 버전 설치 + npm 캐시 설정
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # 3) 의존성 설치
      - name: 의존성 설치
        run: npm ci

      # 4) tsc 컴파일 실행 → dist/ 폴더 생성 및 타입 오류 검출
      - name: TypeScript 빌드 검증
        run: npm run build

  # ─────────────────────────────────────────
  # CD: OCI VM 배포 (main 브랜치 push 시에만)
  #
  # 목적: CI가 모두 통과된 코드를 실제 서버에 자동 배포
  # 실행 조건:
  #   - needs: frontend-ci, backend-ci 가 모두 성공해야 실행
  #   - main 브랜치 push 이벤트일 때만 실행 (PR은 배포 안 함)
  # ─────────────────────────────────────────
  deploy:
    name: Deploy to OCI
    needs: [frontend-ci, backend-ci]   # 두 CI job이 모두 성공해야 이 job 실행
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # ^ PR은 배포 제외 — main에 직접 push된 경우에만 배포

    steps:
      # OCI VM에 SSH로 접속해 배포 스크립트 실행
      # appleboy/ssh-action: SSH 접속 + 원격 명령 실행을 단순화해주는 액션
      - name: OCI VM에 SSH 접속 후 배포
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OCI_HOST }}        # OCI VM 공인 IP
          username: ${{ secrets.OCI_USER }}    # SSH 접속 유저 (예: ubuntu, opc)
          key: ${{ secrets.OCI_SSH_KEY }}      # SSH 개인키 (GitHub Secret에 저장)
          port: ${{ secrets.OCI_PORT || 22 }}  # SSH 포트 (기본 22)
          script: |
            # 오류 발생 시 즉시 스크립트 중단 (안전한 배포를 위해 필수)
            set -e

            # /usr/local/nvm에 설치된 Node.js를 opc 유저 SSH 세션에서 사용 가능하도록 PATH 설정
            export NVM_DIR="/usr/local/nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            cd /opt/tarot

            echo "=== 최신 코드 pull ==="
            # origin/main의 최신 커밋을 VM으로 가져옴
            git pull origin main

            echo "=== 백엔드 .env 생성 ==="
            # GitHub Secrets 값으로 백엔드 .env 파일을 매 배포마다 덮어씀
            # 이렇게 하면 VM에 .env 파일이 없어도 항상 최신 값으로 유지됨
            cat > /opt/tarot/backend/.env << 'ENVEOF'
            PORT=${{ secrets.PORT }}
            NODE_ENV=production
            FRONTEND_URL=${{ secrets.FRONTEND_URL }}
            SUPABASE_URL=${{ secrets.SUPABASE_URL }}
            SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
            SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            MAIL_HOST=${{ secrets.MAIL_HOST }}
            MAIL_PORT=${{ secrets.MAIL_PORT }}
            MAIL_USER=${{ secrets.MAIL_USER }}
            MAIL_PASS=${{ secrets.MAIL_PASS }}
            MAIL_TO=${{ secrets.MAIL_TO }}
            LOG_LEVEL=${{ secrets.LOG_LEVEL }}
            LOG_DIR=${{ secrets.LOG_DIR }}
            ENVEOF

            echo "=== 프론트엔드 .env 생성 ==="
            # NEXT_PUBLIC_ 변수는 빌드 시 번들에 포함되므로 빌드 전에 반드시 작성해야 함
            cat > /opt/tarot/frontend/.env << 'ENVEOF'
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            ENVEOF

            echo "=== 백엔드 빌드 ==="
            cd backend
            # devDependencies 포함 설치 (tsc 빌드에 typescript 필요)
            npm ci
            # TypeScript → JavaScript 컴파일 (결과물: dist/)
            npm run build
            # 빌드 후 devDependencies 제거하여 프로덕션 환경 최적화
            npm prune --omit=dev
            cd ..

            echo "=== 프론트엔드 빌드 ==="
            cd frontend
            # Next.js 프로덕션 빌드 (결과물: .next/)
            npm run build
            
            npm ci --omit=dev
            
            cd ..

            echo "=== 서비스 재시작 ==="
            # pm2: Node.js 프로세스 매니저 — 서버 재시작 및 크래시 자동 복구
            # restart: 이미 실행 중이면 재시작 / 없으면 start로 신규 등록
            pm2 restart tarot-backend || pm2 start backend/dist/server.js --name tarot-backend
            # pm2 save: 현재 프로세스 목록을 저장 → 서버 재부팅 후에도 자동 시작
            pm2 save

            echo "=== 배포 완료 ==="
